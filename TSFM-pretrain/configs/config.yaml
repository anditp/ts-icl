device: "cuda"
np_seed: 42
torch_seed: 42
max_steps: 10000
micro_batch_size: 512
gradient_accumulation_steps: 2
val_split: 0.1

optim:
  lr: 0.001
  gradient_clipping: 1.0
  weight_decay: 0.0
  scheduler:
    warmup_pct: 0.03
    lr_div_factor: 10
    lr_final_div_factor: 100

amp: false
model_compile: false

model:
  d_model: 512
  d_kv: 64
  d_ff: 2048
  num_layers: 6
  num_heads: 8
  dropout_rate: 0.1
  layer_norm_epsilon: 0.000001
  initializer_factor: 0.05
  model_type: "t5"
  feed_forward_proj: "relu"
  vocab_size: 2
  pad_token_id: 0
  rope_theta: 10000.0
  attn_implementation: "eager"
  chronos_config:
    context_length: 128
    input_patch_size: 16
    input_patch_stride: 16
    max_output_patches: 64
    output_patch_size: 16
    quantiles: [0.01, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 0.99]
    use_reg_token: True

data:
  context_length: 128
  prediction_length: 32
  output_patch_size: 16
  min_past: 3

checkpoint_dir: "./checkpoints"
save_temp_every: 1000
save_perm_every: 5000
max_checkpoints: 5
resume_training: False  # Set to False to start training from scratch, ignoring existing checkpoints
only_load_model: False  # Set to True to only load model weights, not optimizer/scheduler state

wandb_log: False
wandb_dir: "./wandb_logs"
wandb_project: "chronos2-pretraining"
wandb_name: null
wandb_mode: "online"
wandb_id: null

mlflow_log: False
mlflow_dir: "./mlflow_logs"
mlflow_experiment: "chronos2-pretraining"
mlflow_run_name: null
mlflow_tags: {}
