[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsfm"
version = "0.1.0"
description = "Time Series Foundation Model pretraining"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chronos-forecasting",
    "datasets",
    "einops",
    "gluonts",
    "petname",
    "pyarrow",
    "python-dotenv",
    "safetensors",
    "scikit-learn",
    "torch>=2.0.0",
    "transformers",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["tsfm*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that take more time (training loops, multi-worker)",
]
